name: Verify distributions

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test isolation guard
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Compile and test both editions
        run: ./gradlew :app:compileFossDebugKotlin :app:compilePlayDebugKotlin :app:testFossDebugUnitTest :app:testPlayDebugUnitTest :app:verifyTranslations --no-daemon
      - name: Build unsigned artifacts and verify FOSS isolation
        run: ./gradlew :app:stageFossRelease :app:bundlePlayRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: distribution-checks
          path: |
            app/build/reports/tests/
            app/build/reports/foss-isolation/
